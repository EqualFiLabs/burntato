[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
auto_detect_solc = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
via_ir = true
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "read-write", path = "./artifacts" },
]

[fmt]
line_length = 120
tab_width = 4

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 50
fail_on_revert = false

[profile.security.fuzz]
runs = 5000

[profile.security.invariant]
runs = 512
depth = 64
fail_on_revert = true
